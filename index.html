<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>gym-tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="app-title">gym-tracker</h1>

      <nav class="nav-tabs" aria-label="Navegación principal">
        <button type="button" class="nav-tab" data-target="home">
          Registrar
        </button>
        <button type="button" class="nav-tab" data-target="history">
          Histórico
        </button>
      </nav>

      <section data-view="home">
        <p class="app-subtitle">Registrar serie</p>

        <form id="set-form" class="set-form" autocomplete="off" novalidate>
          <div class="field">
            <label for="exercise-select" class="field-label">Ejercicio</label>
            <select id="exercise-select" class="field-input" required></select>
            <p id="last-set-indicator" class="last-set-indicator">Sin historial</p>
            <span class="field-error" data-for="exercise-select" hidden></span>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="weight-input" class="field-label">Peso (kg)</label>
              <input
                id="weight-input"
                class="field-input"
                type="number"
                inputmode="decimal"
                step="0.5"
                min="0"
                placeholder="0"
                required
              />
              <span class="field-error" data-for="weight-input" hidden></span>
            </div>

            <div class="field">
              <label for="reps-input" class="field-label">Reps</label>
              <input
                id="reps-input"
                class="field-input"
                type="number"
                inputmode="numeric"
                step="1"
                min="1"
                placeholder="0"
                required
              />
              <span class="field-error" data-for="reps-input" hidden></span>
            </div>
          </div>

          <button type="submit" class="btn-primary">Guardar serie</button>
        </form>
      </section>

      <section data-view="history" hidden>
        <p class="app-subtitle">Histórico de series</p>

        <div class="field">
          <label for="history-filter" class="field-label">Filtrar por ejercicio</label>
          <select id="history-filter" class="field-input">
            <option value="">Todos</option>
          </select>
        </div>

        <div id="history-content"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
